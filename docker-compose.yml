# Entorno de desarrollo local. Las credenciales son solo para desarrollo;
# producción las toma de un gestor de secretos (RI-10, RNF-07).
services:
  app:
    build: ./docker/php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    # log-bin-trust-function-creators: permite a las migraciones crear los triggers
    # que hacen inmutables la auditoría y los consentimientos.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: finantech
      MYSQL_USER: finantech
      MYSQL_PASSWORD: ${DB_PASSWORD:-finantech_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
