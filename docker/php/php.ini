; RN-30: documentos de hasta 10 MB
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off
date.timezone = America/Bogota

; RNF-12: PCOV instalado pero apagado; se enciende solo al medir cobertura:
; php -d pcov.enabled=1 ./vendor/bin/pest --coverage --min=75
pcov.enabled = 0
pcov.directory = /var/www/html/app

; RNF-06 (D-02): las trazas de excepción no guardan argumentos (contraseñas, códigos).
zend.exception_ignore_args = On

; D24 (O-05): PHP revisa si un archivo cambió cada 10 s y no en cada petición (por defecto, 2 s).
; Un cambio en PHP se ve en la API a más tardar 10 s después.
opcache.revalidate_freq = 10
